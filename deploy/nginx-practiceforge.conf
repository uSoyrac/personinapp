# PracticeForge reverse proxy — a SEPARATE server block, safe to drop in
# alongside your other sites. Replace YOURDOMAIN.com with your real domain.
#
# Install: copy to /etc/nginx/sites-available/practiceforge.conf,
#   ln -s /etc/nginx/sites-available/practiceforge.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then add HTTPS with: certbot --nginx -d YOURDOMAIN.com -d www.YOURDOMAIN.com

server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    # Proxy everything to the container (localhost only).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
